name: NajiyaDaily Manual Publisher

on:
  workflow_dispatch:
    inputs:
      morning:
        description: "Morning Edition"
        type: boolean
        default: false
      travel:
        description: "Travel Edition"
        type: boolean
        default: false
      afternoon:
        description: "Afternoon Edition"
        type: boolean
        default: false
      daily_paws:
        description: "Daily Paws"
        type: boolean
        default: false
      evening:
        description: "Evening Edition"
        type: boolean
        default: false
      gadget:
        description: "Gadget Review"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install anthropic requests python-dotenv

      - name: Run selected editions
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          AMAZON_AFFILIATE_TAG: najiyadaily-20
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET:    ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL:             https://www.najiyadaily.com
        run: |
          for edition in morning travel afternoon daily_paws evening gadget; do
            var="INPUT_$(echo $edition | tr '[:lower:]' '[:upper:]')"
            val="${{ github.event.inputs[edition] }}"
            if [ "$val" = "true" ]; then
              echo "Publishing: $edition"
              EDITION=$edition python scripts/nd_publisher.py
              sleep 5
            fi
          done

      - name: Commit and push content
        run: |
          git config user.name  "NajiyaDaily Bot"
          git config user.email "najiyadaily11.11@gmail.com"
          git add content/ scripts/publish_log.json || true
          git diff --staged --quiet || git commit -m "feat: manual publish $(date +'%Y-%m-%d %H:%M')"
          git push
