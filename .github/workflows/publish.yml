name: NajiyaDaily Auto Publisher

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM SLT  — Morning
    - cron: "30 5 * * *"   # 11:00 AM SLT — Travel
    - cron: "30 7 * * *"   # 1:00 PM SLT  — Afternoon
    - cron: "30 9 * * *"   # 3:00 PM SLT  — Daily Paws
    - cron: "30 13 * * *"  # 7:00 PM SLT  — Evening
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Determine edition from schedule
        run: |
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "02" ]; then echo "EDITION=morning"    >> $GITHUB_ENV
          elif [ "$HOUR" = "05" ]; then echo "EDITION=travel"     >> $GITHUB_ENV
          elif [ "$HOUR" = "07" ]; then echo "EDITION=afternoon"  >> $GITHUB_ENV
          elif [ "$HOUR" = "09" ]; then echo "EDITION=daily_paws" >> $GITHUB_ENV
          elif [ "$HOUR" = "13" ]; then echo "EDITION=evening"    >> $GITHUB_ENV
          else echo "EDITION=morning" >> $GITHUB_ENV
          fi

      - name: Run publisher
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL:         ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET:    ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL:             https://www.najiyadaily.com
        run: python scripts/nd_publisher.py

      # ── Smart commit — [skip ci] prevents Netlify rebuild ──────────
      - name: Commit content files (no-trigger)
        run: |
          git config user.name  "NajiyaDaily Bot"
          git config user.email "najiyadaily11.11@gmail.com"
          git add content/ scripts/publish_log.json || true

          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "chore: auto publish ${{ env.EDITION }} $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push || true
          fi
